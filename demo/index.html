<!DOCTYPE html>
<html lang="en">

<head>
    <title>Text Image (text-image.js)</title>
    <meta charset="utf-8" />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dancing+Script">
    <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../demo/css/style.css">
    <script src="../dist/text-image.js"></script>
    <script src="../demo/js/demo.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Text Image<br><small>(text-image.js)</small></h1>
            <a href="https://github.com/vincent7128/text-image" class="fork-me"><img src='../demo/img/fork-me.png'/></a>
        </header>
        <hr>
        <form>
            <div class="form-group">
                <textarea name="image-text" class="form-control" placeholder="Type here...">Change this text create your image

This is a simple placeholder that you can swap out whenever you're ready.

Feel free to adjust the wording to better match your project style.
</textarea>
            </div>
            <div class="image-display text-center">
                <a class="image-download btn btn-success" target="_blank" download="text-image.png">download image</a>
            </div>
            <div class="form-group">
                <label>Filename:</label>
                <input name="filename" type="text" class="form-control" placeholder="leave blank to automatically generate"/>
            </div>
            <div class="form-group">
                <label class="form-check-label">Show grid line: <input name="grid-line" type="checkbox"/></label>
            </div>
            <div class="form-group">
                <label>Font size:</label>
                <input name="font-size" type="number" value="16" min="16" max="64"/>
            </div>
            <div class="form-group">
                <label>Font align:</label>
                <select name="font-align">
                    <option selected value="left">left</option>
                    <option value="center">center</option>
                    <option value="right">right</option>
                </select>
            </div>
            <div class="form-group">
                <label>Font color:</label>
                <label><img src="../demo/img/black.png"/> <input name="font-color" type="radio" value="rgba(0, 0, 0, 1)" checked></label>
                <label><img src="../demo/img/white.png"/> <input name="font-color" type="radio" value="rgba(255, 255, 255, 1)"></label>
                <label><img src="../demo/img/red.png"/> <input name="font-color" type="radio" value="rgba(255, 0, 0, 1)"></label>
                <label><img src="../demo/img/orange.png"/> <input name="font-color" type="radio" value="rgba(255, 127, 0, 1)"></label>
                <label><img src="../demo/img/yellow.png"/> <input name="font-color" type="radio" value="rgba(255, 255, 0, 1)"></label>
                <label><img src="../demo/img/green.png"/> <input name="font-color" type="radio" value="rgba(0, 255, 0, 1)"></label>
                <label><img src="../demo/img/blue.png"/> <input name="font-color" type="radio" value="rgba(0, 0, 255, 1)"></label>
                <label><img src="../demo/img/indigo.png"/> <input name="font-color" type="radio" value="rgba(75, 0, 130, 1)"></label>
                <label><img src="../demo/img/violet.png"/> <input name="font-color" type="radio" value="rgba(149, 0, 211, 1)"></label>
            </div>
            <div class="form-group">
                <label>Background color:</label>
                <label><img src="../demo/img/black.png"/> <input name="background-color" type="radio" value="rgba(0, 0, 0, 1)"></label>
                <label><img src="../demo/img/white.png"/> <input name="background-color" type="radio" value="rgba(255, 255, 255, 1)" checked></label>
                <label><img src="../demo/img/red.png"/> <input name="background-color" type="radio" value="rgba(255, 0, 0, 1)"></label>
                <label><img src="../demo/img/orange.png"/> <input name="background-color" type="radio" value="rgba(255, 127, 0, 1)"></label>
                <label><img src="../demo/img/yellow.png"/> <input name="background-color" type="radio" value="rgba(255, 255, 0, 1)"></label>
                <label><img src="../demo/img/green.png"/> <input name="background-color" type="radio" value="rgba(0, 255, 0, 1)"></label>
                <label><img src="../demo/img/blue.png"/> <input name="background-color" type="radio" value="rgba(0, 0, 255, 1)"></label>
                <label><img src="../demo/img/indigo.png"/> <input name="background-color" type="radio" value="rgba(75, 0, 130, 1)"></label>
                <label><img src="../demo/img/violet.png"/> <input name="background-color" type="radio" value="rgba(149, 0, 211, 1)"></label>
                <label><img src="../demo/img/transparent.png"/> <input name="background-color" type="radio" value="rgba(0, 0, 0, 0)"></label>
            </div>
            <div class="form-group">
                <label class="form-check-label">Word wrap: <input name="word-wrap" type="checkbox" checked='true'/></label>
            </div>
            <div class="form-group">
                <label>Image width (px):</label>
                <input name="max-width" type="number" value="600" min="100" max="2000"/>
            </div>
            <div class="form-group">
                <label>Padding - all sides (px):</label>
                <input name="padding" type="number" value="20" min="0" max="200"/>
            </div>
            <div class="form-group">
                <label>Padding - individual sides (px):</label>
                <div style="margin-left: 20px;">
                    <label>Top: <input name="padding-top" type="number" min="0" max="200" style="width: 80px;"/></label>
                    <label>Right: <input name="padding-right" type="number" min="0" max="200" style="width: 80px;"/></label>
                    <label>Bottom: <input name="padding-bottom" type="number" min="0" max="200" style="width: 80px;"/></label>
                    <label>Left: <input name="padding-left" type="number" min="0" max="200" style="width: 80px;"/></label>
                </div>
            </div>
            <div class="form-group">
                <label>Stroke:</label>
                <input name="stroke" type="number" value="0" min="0"/>
            </div>
            <div class="form-group">
                <label>Stroke color:</label>
                <label><img src="../demo/img/black.png"/> <input name="stroke-color" type="radio" value="rgba(0, 0, 0, 1)"></label>
                <label><img src="../demo/img/white.png"/> <input name="stroke-color" type="radio" value="rgba(255, 255, 255, 1)" checked></label>
                <label><img src="../demo/img/red.png"/> <input name="stroke-color" type="radio" value="rgba(255, 0, 0, 1)"></label>
                <label><img src="../demo/img/orange.png"/> <input name="stroke-color" type="radio" value="rgba(255, 127, 0, 1)"></label>
                <label><img src="../demo/img/yellow.png"/> <input name="stroke-color" type="radio" value="rgba(255, 255, 0, 1)"></label>
                <label><img src="../demo/img/green.png"/> <input name="stroke-color" type="radio" value="rgba(0, 255, 0, 1)"></label>
                <label><img src="../demo/img/blue.png"/> <input name="stroke-color" type="radio" value="rgba(0, 0, 255, 1)"></label>
                <label><img src="../demo/img/indigo.png"/> <input name="stroke-color" type="radio" value="rgba(75, 0, 130, 1)"></label>
                <label><img src="../demo/img/violet.png"/> <input name="stroke-color" type="radio" value="rgba(149, 0, 211, 1)"></label>
            </div>
            <div class="form-group">
                <label>Font family:</label>
                <select name="font-family">
                    <option value="serif">serif</option>
                    <option value="sans-serif">sans-serif</option>
                    <option value="cursive">cursive</option>
                    <option value="fantasy">fantasy</option>
                    <option value="monospace">monospace</option>
                    <option value="'Helvetica Neue'">Helvetica Neue</option>
                    <option value="Helvetica">Helvetica</option>
                    <option value="Arial">Arial</option>
                    <option value="'Dancing Script', cursive">Dancing Script</option>
                    <option selected value="FontAwesome,'Helvetica Neue',Helvetica,Arial,sans-serif">FontAwesome,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif</option>
                </select>
            </div>
            <div>
                <div class="form-group">
                    <label>Line height:</label>
                    <input name="line-height" type="number" step="0.1" value="1.2" />
                    <select name="line-height-unit">
                        <option value="em">em</option>
                        <option value="px">px</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-check-label">Bold: <input name="bold" type="checkbox"/></label>
            </div>
            <div class="form-group">
                <label class="form-check-label">Italic: <input name="italic" type="checkbox"/></label>
            </div>
        </form>
        <footer>
            <hr>
            <h3>License</h3>
            <p>This project is licensed under the MIT License - see the <a href="https://github.com/vincent7128/text-image/blob/master/LICENSE">LICENSE</a> file for details<p>
            <p><small>version: %_VERSION_%, page built @ %_DATE_%</small></p>
        </footer>
    </div>
</body>

</html>
